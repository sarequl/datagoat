name: Feature request
description: Suggest an improvement or new capability for DataGoat
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem you are solving, not
        just the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The pain point or missing capability, in your words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like DataGoat to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fall short.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Anything that should or should not be included, and why.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
