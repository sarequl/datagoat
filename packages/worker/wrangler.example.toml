# DataGoat Worker configuration template.
#
# Copy this file to `wrangler.toml` (git-ignored) and fill in real IDs before
# deploying. For local development the placeholder values below work with
# `wrangler dev --local` / `wrangler d1 migrations apply --local`.
#
#   cp wrangler.example.toml wrangler.toml
#
# Required variables:
#   INSTALL_SECRET   per-install secret used to derive cookieless visitor ids.
#                    Rotating it resets every cookieless visitor id.
#   SECRET_VERSION   integer stored alongside derived ids so rotation is visible.
#   SESSION_SECRET   HMAC key for the `dg_session` JWT. Set it with
#                    `wrangler secret put SESSION_SECRET` in production; the
#                    placeholder below is only for local development.

name = "datagoat"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Node.js compatibility is not required at runtime, but keep it on so local
# tooling that expects Node APIs (vitest, wrangler) behaves predictably.
compatibility_flags = ["nodejs_compat"]

# Do not send metrics to Cloudflare from self-hosted installs.
send_metrics = false

# Built dashboard. `npm run deploy` runs `npm run build:web` first; the build
# output is git-ignored. The single-page-application fallback serves
# `index.html` for client-side routes and `GET /`.
[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "datagoat-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[triggers]
crons = ["*/5 * * * *"]

[vars]
INSTALL_SECRET = "dev-only-insecure-install-secret"
SECRET_VERSION = "1"
SESSION_SECRET = "dev-only-insecure-session-secret-change-me"
